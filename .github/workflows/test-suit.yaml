name: Test Suit
run-name: "Testing rila, triggered by ${{ github.actor }}"

# Manual only: these are live on-chain tests against testnet
on:
  workflow_dispatch:
    inputs:
      protocol:
        description: "Protocol to test, e.g. SOLANA-METIS-USDC (default: vars.PROTOCOL)"
        type: string
      oracle-code-id-different-protocol:
        description: "An oracle code id from ANOTHER protocol (default: vars.ORACLE_CODE_ID_DIFFERENT_PROTOCOL)"
        type: string
      node-url:
        description: "rila RPC (default: vars.NODE_URL, else the prep's own default)"
        type: string
      admin-contract-address:
        description: "Admin contract (default: vars.ADMIN_CONTRACT_ADDRESS, else the prep's own default)"
        type: string
      nolus-core-tag:
        description: "Pin a nolus-core release instead of the latest (default: vars.NOLUS_CORE_TAG)"
        type: string
      active-lease-address:
        description: "Lease with available interest — enables the interest cases (default: vars.ACTIVE_LEASE_ADDRESS)"
        type: string
      no-price-currency-ticker:
        description: "A ticker the oracle prices nothing for (default: vars.NO_PRICE_CURRENCY_TICKER)"
        type: string
      suites:
        description: "Narrow the run to these jest paths, space-separated. Empty runs everything."
        type: string
      test-transfer:
        description: "Test transfer"
        type: boolean
        default: true
      test-oracle:
        description: "Test oracle"
        type: boolean
        default: true
      test-borrower:
        description: "Test borrower"
        type: boolean
        default: true
      test-lender:
        description: "Test lender"
        type: boolean
        default: true
      test-treasury:
        description: "Test treasury"
        type: boolean
        default: true
      test-profit:
        description: "Test profit"
        type: boolean
        default: true
      test-timealarms:
        description: "Test timealarms"
        type: boolean
        default: true
      test-reserve:
        description: "Test reserve"
        type: boolean
        default: true
      test-staking:
        description: "Test staking (strands the delegated NLS — see the note in the workflow)"
        type: boolean
        default: false
      test-vesting:
        description: "Test vesting (continuous vesting accounts; slow, ~215s)"
        type: boolean
        default: false

# Two runs at once collide on the shared wallet's account nonce; cancelling one can leave a
# lease open and a packet in flight, so queue instead.
concurrency:
  group: test-suit-rila
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: rila
    timeout-minutes: 360
    env:
      TEST_WALLET_MNEMONIC: ${{ secrets.TEST_WALLET_MNEMONIC }}
      PROTOCOL: ${{ inputs.protocol || vars.PROTOCOL }}
      ORACLE_CODE_ID_DIFFERENT_PROTOCOL: ${{ inputs.oracle-code-id-different-protocol || vars.ORACLE_CODE_ID_DIFFERENT_PROTOCOL }}
      NODE_URL: ${{ inputs.node-url || vars.NODE_URL }}
      ADMIN_CONTRACT_ADDRESS: ${{ inputs.admin-contract-address || vars.ADMIN_CONTRACT_ADDRESS }}
      NOLUS_CORE_TAG: ${{ inputs.nolus-core-tag || vars.NOLUS_CORE_TAG }}
      ACTIVE_LEASE_ADDRESS: ${{ inputs.active-lease-address || vars.ACTIVE_LEASE_ADDRESS }}
      NO_PRICE_CURRENCY_TICKER: ${{ inputs.no-price-currency-ticker || vars.NO_PRICE_CURRENCY_TICKER }}
      SUITES: ${{ inputs.suites }}
      TEST_TRANSFER: ${{ inputs.test-transfer }}
      TEST_ORACLE: ${{ inputs.test-oracle }}
      TEST_BORROWER: ${{ inputs.test-borrower }}
      TEST_LENDER: ${{ inputs.test-lender }}
      TEST_TREASURY: ${{ inputs.test-treasury }}
      TEST_PROFIT: ${{ inputs.test-profit }}
      TEST_TIMEALARMS: ${{ inputs.test-timealarms }}
      TEST_RESERVE: ${{ inputs.test-reserve }}
      TEST_STAKING: ${{ inputs.test-staking }}
      TEST_VESTING: ${{ inputs.test-vesting }}
      RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: "Install jq"
        run: sudo apt-get update && sudo apt-get install -y jq

      - run: yarn --frozen-lockfile

      - name: "Check the required settings are present"
        run: |
          missing=()
          [[ -n "$TEST_WALLET_MNEMONIC" ]] || missing+=("secrets.TEST_WALLET_MNEMONIC")
          [[ -n "$PROTOCOL" ]] || missing+=("vars.PROTOCOL or the protocol input")
          [[ -n "$ORACLE_CODE_ID_DIFFERENT_PROTOCOL" ]] ||
            missing+=("vars.ORACLE_CODE_ID_DIFFERENT_PROTOCOL or the oracle-code-id-different-protocol input")

          if [[ ${#missing[@]} -gt 0 ]]; then
            printf 'Missing required setting: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: "Prepare the env file"
        run: |
          args=(
            --test-wallet-mnemonic "$TEST_WALLET_MNEMONIC"
            --protocol "$PROTOCOL"
            --oracle-code-id-different-protocol "$ORACLE_CODE_ID_DIFFERENT_PROTOCOL"
            --active-lease-address "$ACTIVE_LEASE_ADDRESS"
            --no-price-currency-ticker "$NO_PRICE_CURRENCY_TICKER"
            --nolus-core-version-tag "$NOLUS_CORE_TAG"
            --test-transfer-flag "$TEST_TRANSFER"
            --test-oracle-flag "$TEST_ORACLE"
            --test-borrower-flag "$TEST_BORROWER"
            --test-lender-flag "$TEST_LENDER"
            --test-treasury-flag "$TEST_TREASURY"
            --test-profit-flag "$TEST_PROFIT"
            --test-timealarms-flag "$TEST_TIMEALARMS"
            --test-reserve-flag "$TEST_RESERVE"
            --test-staking-flag "$TEST_STAKING"
            --test-vesting-flag "$TEST_VESTING"
          )

          # Only when set: an empty value would override the prep's own default. `if` rather than
          # `[[ … ]] && …`, which aborts the step under `bash -e` when the test is false.
          if [[ -n "$NODE_URL" ]]; then
            args+=(--node-url "$NODE_URL")
          fi

          if [[ -n "$ADMIN_CONTRACT_ADDRESS" ]]; then
            args+=(--admin-contract-address "$ADMIN_CONTRACT_ADDRESS")
          fi

          # The prep traces under `set -x`, and GitHub masks the mnemonic but not the private keys
          # derived from it — so its output must never reach the job log.
          if ! yarn prepare-env "${args[@]}" >"$RUNNER_TEMP/prepare-env.log" 2>&1; then
            echo "::error::prepare-env failed. Its log is withheld because it contains key material."
            exit 1
          fi

          echo "Wrote .env for $PROTOCOL."

      - name: "Run the suites"
        run: |
          # Unquoted on purpose: SUITES is a space-separated list of jest paths, or empty.
          # shellcheck disable=SC2086
          yarn test $SUITES

      - name: "Upload the run artefacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ env.RUN_ID }}
          path: .runs/${{ env.RUN_ID }}/
          if-no-files-found: warn
